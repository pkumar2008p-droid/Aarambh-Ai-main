services:
  # Flask API. Set DATABASE_URL, DATA_KEY, PEPPER and FRONTEND_ORIGINS
  # in the Render dashboard before the first successful deploy.
  - type: web
    name: aarambh-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SAMESITE
        value: None
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: DATABASE_URL
        sync: false
      - key: DATA_KEY
        sync: false
      - key: PEPPER
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false

  # React/Vite frontend. Set VITE_API_BASE_URL to the aarambh-ai API URL.
  - type: web
    name: aarambh-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
